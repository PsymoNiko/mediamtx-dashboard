# API
api: yes
apiAddress: :9997
apiEncryption: no
apiAllowOrigin: '*'

# Metrics
metrics: yes
metricsAddress: :9998
metricsEncryption: no
metricsAllowOrigin: '*'

# RTSP
rtsp: yes
rtspTransports: [udp, tcp]
rtspEncryption: "no"
rtspAddress: :8554

# RTMP
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# HLS
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: '*'
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: ''

# WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcICEServers2: []

# SRT
srt: yes
srtAddress: :8890

# Path defaults
pathDefaults:
  source: publisher
  sourceOnDemand: no
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  maxReaders: 0
  record: no
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 24h
  overridePublisher: yes

