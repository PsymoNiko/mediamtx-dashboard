################################################
# MediaMTX Configuration for Docker
################################################

# Log level
logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: admin
    pass: adminpass
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof
